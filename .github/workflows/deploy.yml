name: Deploy to AKS

on:
  push:
    branches:
      - AKS-Cluster

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️ Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️ Set up kubectl
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      # 3️ Decode kubeconfig and persist it for all steps
      - name: Configure kubeconfig
      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.AKS_KUBECONFIG }}" | base64 --decode > $HOME/kubeconfig.yaml
          echo "KUBECONFIG=$HOME/kubeconfig.yaml" >> $GITHUB_ENV

      # 4️ Apply namespaces
      - name: Apply namespaces
        run: |
          kubectl apply -f namespace.yaml
          kubectl apply -f ingress-nginx-namespace.yaml

      # 5️ Install cert-manager CRDs
      - name: Install cert-manager CRDs
        run: |
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.crds.yaml

      # 6️ Install cert-manager (not just the CRDs)
      - name: Install cert-manager
        run: |
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml
          kubectl rollout status deployment/cert-manager -n cert-manager
          kubectl rollout status deployment/cert-manager-webhook -n cert-manager
          kubectl rollout status deployment/cert-manager-cainjector -n cert-manager

      # 7️ Apply ClusterIssuer for Let's Encrypt
      - name: Apply ClusterIssuer
        run: |
          kubectl apply -f ClusterIssuer.yaml

      # 8️ Deploy your app
      - name: Deploy application
        run: |
          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml

      # 9️ Deploy ingress-nginx controller
      - name: Apply ingress-nginx controller
        run: |
          kubectl apply -f ingress-nginx-controller.yaml --wait

      # 10 Apply Ingress with TLS annotations
      - name: Apply Ingress
        run: |
          kubectl apply -f ingress.yaml --wait

      #  Wait for TLS certificate request
      - name: Wait for TLS certificate
        run: |
          echo "Waiting for TLS certificate to be ready..."
          kubectl wait --for=condition=Ready certificate/wisecow-tls -n wisecow --timeout=300s || true
